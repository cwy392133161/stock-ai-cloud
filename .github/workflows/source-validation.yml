name: Read-only source validation (no AI)
on:
  push:
    branches: [fix/tencent-a-fallback, fix/hk-shared-budget]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate shared-budget production path and outage recovery (no publishing)
        run: python -u production_probe.py
