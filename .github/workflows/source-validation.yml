name: Read-only source validation (no AI)
on:
  push:
    branches: [fix/tencent-a-fallback]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tencent-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate A-share universe and unchanged scoring (no publishing)
        run: |
          python -u - <<'PY'
          import json
          from tencent_market import fetch_tencent_a
          from picker import score_a
          frame = fetch_tencent_a()
          print(json.dumps(frame.attrs["quality"], ensure_ascii=False, indent=2))
          print("Eligible under unchanged score rules:", len(score_a(frame)))
          PY
  eastmoney-hk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate existing HK raw source (no publishing)
        run: python -u market_probe.py --market HK
