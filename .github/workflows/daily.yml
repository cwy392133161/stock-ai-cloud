# 每天工作日北京时间 17:10 自动选股，并把结果发布到 GitHub Pages
# 北京时间 17:10 = UTC 09:10；GitHub 定时任务可能延迟数小时或漏触发
name: Daily stock screening and Pages

on:
  schedule:
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      report_only:
        description: "仅生成 AI 报告（使用已发布的行情快照，跳过实时选股）"
        type: boolean
        default: false
      skip_ai:
        description: "跳过 AI，仅更新行情和报告时效标识（不调用付费模型）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 验证行情质量与评分逻辑（离线测试）
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 检查手动报告所用快照
        if: ${{ inputs.report_only }}
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          SKIP_AI: ${{ inputs.skip_ai }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          if os.getenv("SKIP_AI") == "true":
              raise SystemExit("report_only 与 skip_ai 不能同时选择")
          snapshot = json.loads(Path("docs/data.json").read_text())
          if os.getenv("AI_ENABLED") != "true":
              raise SystemExit("请启用 AI_ENABLED 后生成报告")
          for field in ("a_shares", "hk_shares"):
              rows = snapshot[field]
              if len(rows) != 20 or len({row["代码"] for row in rows}) != 20:
                  raise SystemExit(f"快照榜单不完整: {field}")
          print("本次报告使用已发布行情快照:", snapshot["updated"])
          PY

      - name: 判断北京时间是否为交易工作日
        id: trading_day
        if: ${{ !inputs.report_only }}
        env:
          SCHEDULE_EVENT_NAME: ${{ github.event_name }}
        run: python market_schedule.py

      - name: 运行选股
        id: screening
        if: ${{ !inputs.report_only && steps.trading_day.outputs.market_ready == 'true' }}
        continue-on-error: true
        run: python picker.py

      - name: 安装公告 PDF 文本读取工具
        continue-on-error: true
        if: ${{ !inputs.skip_ai && vars.AI_ENABLED == 'true' && (inputs.report_only || steps.screening.outcome == 'success') }}
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)

      - name: 生成可选 AI 深度分析
        id: deep_research
        if: ${{ !inputs.skip_ai && vars.AI_ENABLED == 'true' && (inputs.report_only || steps.screening.outcome == 'success') }}
        continue-on-error: ${{ !inputs.report_only }}
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ "${{ inputs.report_only }}" = "true" ]; then
            test -n "$AI_API_KEY" && test -n "$AI_MODEL" && test -n "$AI_BASE_URL" || { echo "AI 配置不完整"; exit 1; }
          fi
          python ai_report.py

      - name: 标记AI报告与本期行情快照是否同步
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_JOB_STATUS: ${{ steps.deep_research.outcome }}
          SKIP_AI: ${{ inputs.skip_ai }}
          SCREENING_OUTCOME: ${{ steps.screening.outcome }}
          TRADING_WEEKDAY: ${{ steps.trading_day.outputs.trading_weekday }}
          MARKET_READY: ${{ steps.trading_day.outputs.market_ready }}
          SCHEDULE_EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_STATE: ${{ steps.trading_day.outputs.schedule_state }}
          SCHEDULE_OBSERVED_AT: ${{ steps.trading_day.outputs.schedule_observed_at }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: python publish_guard.py

      - name: 提交结果（仅当页面有变化）
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/index.html docs/data.json docs/ai-status.json
          if [ -f docs/ai.html ]; then git add docs/ai.html; fi
          git diff --cached --quiet || git commit -m "更新选股榜 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: 标记未完成的定时更新或行情故障
        if: ${{ !inputs.report_only }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from market_schedule import SCHEDULE_BLOCK_REASONS
          status = json.loads(Path("docs/ai-status.json").read_text(encoding="utf-8"))
          if status.get("schedule_state") in SCHEDULE_BLOCK_REASONS:
              print("::error::" + SCHEDULE_BLOCK_REASONS[status["schedule_state"]])
              raise SystemExit(1)
          if status.get("market_state") == "failed":
              print("::error::最近一次行情更新失败后尚无更新的成功快照。跳过选股不能证明恢复；请勿将旧行情当作本期结果。")
              raise SystemExit(1)
          PY
