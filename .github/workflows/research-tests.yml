name: Research code and offline tests

on:
  push:
    paths:
      - 'ai_report.py'
      - 'publish_guard.py'
      - 'evidence_guard.py'
      - 'finance.py'
      - 'financial_history.py'
      - 'research_brief.py'
      - 'cash_profit_observations.py'
      - 'research_quality.py'
      - 'peer_valuation.py'
      - 'peer_fundamentals.py'
      - 'research_differentiation.py'
      - 'filing_text.py'
      - 'period_reports.py'
      - 'disclosures.py'
      - 'picker.py'
      - 'market_schedule.py'
      - 'market_quality.py'
      - 'market_probe.py'
      - 'market_transport.py'
      - 'market_freshness.py'
      - 'tencent_market.py'
      - '.github/workflows/market-probe.yml'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
      - 'tests/**'
      - 'test_*.py'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-offline-tests-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q -f .
      - name: Offline research regression tests (no external API)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Original financial regression tests (no external API)
        run: python -m unittest test_finance test_hk_original test_hk_products test_report -v

