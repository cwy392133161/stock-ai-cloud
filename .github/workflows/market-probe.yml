name: Read-only market data probe
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to validate (no AI or publication)
        type: choice
        default: HK
        options: [A, HK]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate real quotes without AI or publication
        env:
          PROBE_MARKET: ${{ inputs.market }}
        run: python market_probe.py --market "$PROBE_MARKET"
